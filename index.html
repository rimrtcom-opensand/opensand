      }
      async function autoLoadEncrypted(url) {
        try {
          showLoading('Loading encrypted scenario...');

          const res = await fetch(url);
          if (!res.ok) throw new Error('HTTP error ' + res.status);
          const jsonText = await res.text();
          let jsonObj;
          try {
            jsonObj = JSON.parse(jsonText);
          } catch {
            showMessage('Invalid encrypted CSV format');
            hideLoading();
            setTimeout(function () {
              location.reload();
            }, 1200);
            return false;
          }

          const pwd = prompt('Encrypted scenario. Enter password:');
          if (!pwd || pwd.trim() === '') {
            showMessage('No password entered');
            hideLoading();
            setTimeout(function () {
              location.reload();
            }, 1200);
            return false;
          }
          const decrypted = await decryptCSVEnc(jsonObj, pwd);

          if (!decrypted) {
            showMessage('Decryption failed');
            hideLoading();
            setTimeout(function () {
              location.reload();
            }, 1200);
            return false;
          }
          await startFromCSVText(decrypted);
          return true;
        } catch (e) {
          console.error('autoLoadEncrypted failed:', e);
          showMessage('Failed to load encrypted CSV');
          hideLoading();
          setTimeout(function () {
            location.reload();
          }, 1200);

          return false;
        }
      }
      const GOOGLE_SHEET_RULES = [
        {
          name: '期間 AND 時間帯',
          priority: 1,
          period: { start: '2026-01-26', end: '2027-01-30' },
          daily: { startHour: 12, endHour: 24 },
          url: '',
        },
        {
          name: '期間内のみ',
          priority: 2,
          period: { start: '2026-01-26', end: '2026-01-30' },
          url: '',
        },
        {
          name: '毎日12～13時のみ',
          priority: 3,
          daily: { startHour: 12, endHour: 13 },
          url: '',
        },
        {
          name: '通常データ',
          priority: 999,
          default: true,
          url: '',
        },
      ];
      const STORY_FILE_RULES = [
        {
          name: '昼間ストーリー',
          priority: 1,
          daily: { startHour: 12, endHour: 24 },
          file: '',
        },
        {
          name: 'イベント期間',
          priority: 2,
          period: { start: '2026-01-01', end: '2026-01-31' },
          file: '',
        },
        {
          name: '通常',
          priority: 999,
          default: true,
          file: 'story.csv',
        },
      ];

      function matchTimeRule(rule) {
        const now = new Date();
        const todayStr = now.toISOString().split('T')[0];
        const hour = now.getHours();
        if (rule.period) {
          if (!(todayStr >= rule.period.start && todayStr <= rule.period.end)) return false;
        }
        if (rule.daily) {
          if (!(hour >= rule.daily.startHour && hour < rule.daily.endHour)) return false;
        }
        return true;
      }
      function getGoogleSheetURL() {
        const sorted = [...GOOGLE_SHEET_RULES].sort(
          (a, b) => (a.priority ?? 999) - (b.priority ?? 999)
        );
        for (const rule of sorted) {
          if (rule.default) return rule.url;
          if (matchTimeRule(rule) && rule.url) return rule.url;
        }
        return '';
      }
      function getStoryFile() {
        const sorted = [...STORY_FILE_RULES].sort(
          (a, b) => (a.priority ?? 999) - (b.priority ?? 999)
        );
        for (const rule of sorted) {
          if (rule.default) return rule.file || 'story.csv';
          if (matchTimeRule(rule) && rule.file) return rule.file;
        }
        return 'story.csv';
      }

      const GOOGLE_SHEET_URL = getGoogleSheetURL();
      async function autoLoadHybrid(url) {
        try {
          showLoading('Reading CSV or encrypted CSV...');
          const res = await fetch(url);
          if (!res.ok) throw new Error('HTTP error ' + res.status);
          let text = await res.text();
          let isJSON = false;
          text = text.trim();
          if (text.startsWith('"') && text.endsWith('"')) {
            text = text.slice(1, -1).replace(/""/g, '"');
          }
          try {
            const parsed = JSON.parse(text);
            if (parsed && parsed.version && parsed.ciphertext) isJSON = true;
          } catch (e) {}
          if (isJSON) {
            const result = await autoLoadEncryptedData(text);
            return result;
          } else {
            const result = await autoLoadCSVDirect(text);
            hideLoading();
            return result;
          }
        } catch (e) {
          showMessage('Hybrid loading error: ' + e.message);
          return false;
        }
      }
      async function autoLoadCSV(url) {
        try {
          const res = await fetch(url, {
            cache: 'no-store',
          });
          if (!res.ok) return false;
          const text = await res.text();
          return await autoLoadCSVDirect(text);
        } catch (e) {
          return false;
        }
      }
      async function autoLoadCSVDirect(csvText) {
        try {
          return await startFromCSVText(csvText);
        } catch (e) {
          showMessage('Failed to load CSV');
          return false;
        }
      }
      async function autoLoadEncryptedData(jsonText) {
        let jsonObj;
        try {
          jsonObj = JSON.parse(jsonText);
        } catch {
          showMessage('Invalid encrypted CSV format');
          return false;
        }
        const pwd = prompt('Encrypted scenario. Enter password:');

        if (!pwd || pwd.trim() === '') {
          showMessage('No password entered');
          return false;
        }
        const decrypted = await decryptCSVEnc(jsonObj, pwd);
        if (!decrypted) {
          showMessage('Decryption failed (wrong password)');
          return false;
        }

        return await startFromCSVText(decrypted);
      }
      window.onload = async () => {
        if (typeof renderSaveSlots === 'function') {
          renderSaveSlots();
        }
        if (typeof renderLoadSlots === 'function') {
          renderLoadSlots();
        }
        const input = document.getElementById('csvInput');
        const overlay = document.getElementById('loadingOverlay');
        loadAudioStorage();
        updateAudioIcons();
        let loaded = false;
        if (location.protocol !== 'file:') {
          try {
            const storyFile = getStoryFile();
            const head = await fetch(storyFile, {
              method: 'HEAD',
            });
            if (head.ok) {
              loaded = await autoLoadCSV(storyFile);
            }
          } catch (e) {}
          const USE_ENC_CSV = false;
          if (!loaded && USE_ENC_CSV) {
            const headEnc = await fetch('story.enc.csv', {
              method: 'HEAD',
            });
            if (headEnc.ok) {
              loaded = await autoLoadEncrypted('story.enc.csv');
            }
          }
          if (!loaded && GOOGLE_SHEET_URL) {
            loaded = await autoLoadHybrid(GOOGLE_SHEET_URL);
          }
        }
        if (loaded) return;
        document.body.classList.add('loading');
        if (overlay) {
          const lt = document.getElementById('loadingText');
          if (lt) lt.textContent = 'Select a CSV file...';
        }
        input.addEventListener(
          'change',
          async e => {
            const file = e.target.files[0];
            if (!file) return;
            input.style.display = 'none';
            if (file.name.endsWith('.enc.csv')) {
              const text = await file.text();

              let jsonObj;
              try {
                jsonObj = JSON.parse(text);
              } catch {
                showMessage('Invalid encrypted file format');
                setTimeout(function () {
                  location.reload();
                }, 1200);
                return;
              }
              const pwd = prompt('Encrypted CSV. Enter password:');
              if (pwd === null || pwd.trim() === '') {
                showMessage('No password entered');
                setTimeout(function () {
                  location.reload();
                }, 1200);
                return;
              }

              const decrypted = await decryptCSVEnc(jsonObj, pwd);
              if (!decrypted) {
                showMessage('Decryption failed (wrong password)');
                setTimeout(function () {
                  location.reload();
                }, 1200);
                return;
              }
              await startFromCSVText(decrypted);
              return;
            }

            const text = await file.text();
            await startFromCSVText(text);
          },
          {
            once: true,
          }
        );
        input.click();
      };
      document.addEventListener('keydown', e => {
        const active = document.activeElement;
        if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) {
          return;
        }
        if (awaitingChoice && /^[1-9]$/.test(e.key)) {
          const index = Number(e.key) - 1;
          const buttons = document.querySelectorAll('#buttonArea.active .choice-btn');
          if (buttons[index]) {
            e.preventDefault();
            buttons[index].click();
          }
          return;
        }
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            proceedStory();
          }
        });
      });
